	    height: 12vw;

	    object-position: top;

	    padding: 0; 
        }

	    margin-left: 5vw;

		margin: 0.2vw;
    	}
	.my-button:hover {

        }
        /* Remove underline and padding/margin from links */
        a.my-button {

            margin: 0.2vw;
            padding: 0;
        }
