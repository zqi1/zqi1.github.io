<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIAN QIN - Personal Webpage</title>
    <style>
        body{
            font-family: Verdana, "KaiTi", "楷体", "STKaiti", "KaiTi_GB2312", sans-serif;
	    font-size: 0.9vw;
            margin-left: 15vw;
	    margin-right: 15vw;
            padding: 0;
            background-color: #f4f4f4;
        }
        header{
            background-color: #333;
            color: #fff;
            padding: 1vw;
            text-align: center;
        }
        section {
            padding: 0.5vw;
            margin-bottom: 0.5vw;
            background-color: #fff;
        }
	.container {
	    max-width: 2000vw;
	    display: flex;
            align-items: center; /* Align items to the start of the container */
	    margin-left: 5vw;
	    margin-right: 5vw;
	    overflow: hidden;
		
        }
  	.image-row {
	    	display: flex;
            	justify-content: center;
		align-items: center;
        }
        .image-item {
		display: flex;
        	justify-content: center;
		flex: 1;
		text-align: center; /* Center the caption under the image */
        }
        .image-item img {
		width: 100%;
		max-width: 40vw;
		display: block;
	}
        .image-item figcaption {
        	margin-top: 0.1vw; /* Space between image and caption */
        	color: #555;
		gap: 0.1vw;
        }
        .non-scrollable-text {
            width: 100%; /* Set the same width for consistency */
            padding: 0.5vw; /* Optional: Add some padding for better readability */
            background-color: #FFFFFF; /* Optional: Set a background color */
        }
	.my-button {
        	font-size: 0.9vw; /* Adjust font size */
        	padding: 0.2vw 0.5vw; /* Customize padding */
		border: none;
		text-decoration: none;
		color: #fff;
		background-color: #333;
		display: inline-block;
		margin: 0.2vw;
    	}
	.my-button:hover {
            background-color: #e0e0e0; /* Change color on hover to make it interactive */
        }
        /* Remove underline and padding/margin from links */
        a.my-button {
            text-decoration: none; /* Ensure no underline if buttons are links */
            margin: 0.2vw;
            padding: 0;
        }
    
	@media (max-device-width: 768px) {


		* {
   			margin: 0;
    			padding: 0;
    			box-sizing: border-box;
		}
		
		body {
            		font-family: Verdana, "KaiTi", "楷体", "STKaiti", "KaiTi_GB2312", sans-serif;
	    		font-size: 1.4vw;
            		margin-left: 1vw;
	   		margin-right: 1vw;
           		padding: 0;
            		background-color: #f4f4f4;
        	}

		.container {
	    		max-width: 2000vw;
	    		display: flex;
            		align-items: center; /* Align items to the center of the container */
	    		margin-left: 5vw;
	    		margin-right: 5vw;

        	}    
		.image-row {
	    		display: flex;
            		justify-content: center;
			align-items: center;
	    	}
        	.image-item {
			display: flex;
        		justify-content: center;
			flex: 1;
            		text-align: center; /* Center the caption under the image */
        	}
        	.image-item img {
			width: 100%;
			max-width: 80vw;
			display: block;
        	}
        	.image-item figcaption {
            		margin-top: 0.1vw; /* Space between image and caption */
            		color: #555;
	    		gap: 0.1vw;
        	}
 
		.my-button {
        		font-size: 1.4vw; /* Adjust font size */
        		padding: 0.2vw 0.5vw; /* Customize padding */
			border: none;
			text-decoration: none;
			color: #fff;
			background-color: #333;
			display: inline-block;
			margin: 0.2vw;
    		}


	}	 

	    
        h1, h2 {
            color: #0000B;
        }
        footer {
            text-align: center;
            padding: 1vw;
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Zian Qin 秦子安</h1>
        </div>

	<a href="index.html" class="my-button">Homepage</a>
    </header>
    
    <section id="Invited Talk">
        <div class="container">

		<div class="non-scrollable-text">
		
			<h2>To be updated</h2>

		</div>

	</div>

        


    <footer>
        <div class="container">
            <p>&copy; 2024 Zian Qin. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
